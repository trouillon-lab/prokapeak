[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prokapeak"
version = "0.1.0"
description = "ProkaPeak: assign MACS3 peaks to target genes through TSS and gene-start windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Alexandre Dentler" }, { name = "Julian Trouillon" }]
keywords = ["ChIP-seq", "DAP-seq", "MACS3", "transcription factor", "operon", "bacteria"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = ["numpy>=1.21", "pandas>=1.4"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/trouillon-lab/prokapeak"

[project.scripts]
assign-targets = "assign_targets:main"
predict-operons = "predict_operons:main"

[tool.setuptools]
py-modules = ["assign_targets", "predict_operons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
